
name: Build NoirTV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

    

      - name: Extract NoirTV project
        run: unzip -o NoirTV-source.zip -d extracted

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/NoirTV
        run: gradle assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NoirTV-APK
          path: extracted/NoirTV/app/build/outputs/apk/debug/*.apk
